# JWT_SECRET (mesma chave HS256 de Users/Catalog/Lambda) a partir de fgc/kong no Secrets Manager.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fgc-kong
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: fgc-kong-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: fgc/kong
