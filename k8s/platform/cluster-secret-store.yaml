# Fonte dos ExternalSecrets: AWS Secrets Manager (fgc/*, gerados em fgc-infra/env/secrets.tf).
# Sem bloco auth: o controller usa as credenciais da própria ServiceAccount (EKS Pod Identity,
# role fgc-pod-external-secrets com GetSecretValue apenas em fgc/*).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-2
