services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: fgc-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fgc_network

  fgc-users-api:
    build:
      context: ../fgc-users-api
      dockerfile: Dockerfile
    container_name: fgc-users-api
    ports:
      - "5038:8080"
    environment:
      - RabbitMq__Host=rabbitmq
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - AWS__DynamoDB__ServiceUrl=http://dynamodb-local:8000
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - AWS_REGION=us-east-1
      - Redis__ConnectionString=redis:6379
    depends_on:
      rabbitmq:
        condition: service_healthy
      dynamodb-local:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - fgc_network

  fgc-catalog-api:
    build:
      context: ../fgc-catalog-api
      dockerfile: Dockerfile
    container_name: fgc-catalog-api
    ports:
      - "5070:8080"
    environment:
      - RabbitMq__Host=rabbitmq
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - AWS__DynamoDB__ServiceUrl=http://dynamodb-local:8000
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - AWS_REGION=us-east-1
      - Redis__ConnectionString=redis:6379
    depends_on:
      rabbitmq:
        condition: service_healthy
      dynamodb-local:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - fgc_network

  dynamodb-local:
    image: amazon/dynamodb-local
    container_name: fgc-dynamodb-local
    ports:
      - "8500:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    networks:
      - fgc_network

  redis:
    image: redis:7-alpine
    container_name: fgc-redis
    ports:
      - "6379:6379"
    networks:
      - fgc_network

  fgc-payments-api:
    build:
      context: ../fgc-payments-api
      dockerfile: Dockerfile
    container_name: fgc-payments-api
    ports:
      - "5050:8080"
    environment:
      - RabbitMq__Host=rabbitmq
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - fgc_network

  localstack:
    image: localstack/localstack:latest
    container_name: fgc-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=lambda,dynamodb,apigateway,iam,cloudformation,logs,sts,cloudwatch,secretsmanager,mq
      - DOCKER_HOST=unix:///var/run/docker.sock
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:?defina LOCALSTACK_AUTH_TOKEN no ambiente antes de subir}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - fgc_network

  notifications-lambda-deploy:
    build:
      context: ../fgc-notifications-lambda
      dockerfile: deploy/Dockerfile
    container_name: fgc-notifications-lambda-deploy
    environment:
      - LOCALSTACK_HOSTNAME=localstack
      - JWT_KEY=FgcUsers-Auth-JWT-Key-2026-Strong-And-Secure
    depends_on:
      localstack:
        condition: service_healthy
    networks:
      - fgc_network
    restart: "no"

  notifications-lambda-logs:
    build:
      context: ../fgc-notifications-lambda/deploy/logs
      dockerfile: Dockerfile
    container_name: fgc-notifications-lambda-logs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      notifications-lambda-deploy:
        condition: service_completed_successfully
    networks:
      - fgc_network

  notifications-lambda-bridge:
    build:
      context: ../fgc-notifications-lambda/deploy/bridge
      dockerfile: Dockerfile
    container_name: fgc-notifications-lambda-bridge
    profiles:
      - tools
    environment:
      - RABBITMQ_HOST=rabbitmq
      - LOCALSTACK_ENDPOINT=http://localstack:4566
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - fgc_network

  kong:
    build:
      context: ./kong
      dockerfile: Dockerfile
    container_name: fgc-kong
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/tmp/kong.yml
      - KONG_ADMIN_LISTEN=0.0.0.0:8001
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - JWT_SECRET=FgcUsers-Auth-JWT-Key-2026-Strong-And-Secure
      - NOTIFICATIONS_HISTORY_URL=${NOTIFICATIONS_HISTORY_URL:-http://localstack:4566/restapis/PLACEHOLDER/local/_user_request_}
    volumes:
      - ./kong/kong.yml.template:/kong-src/kong.yml.template:ro
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
    depends_on:
      - fgc-users-api
      - fgc-catalog-api
    networks:
      - fgc_network

  prometheus:
    image: prom/prometheus:latest
    container_name: fgc-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - fgc_network
    depends_on:
      - fgc-users-api
      - fgc-catalog-api

  grafana:
    image: grafana/grafana:latest
    container_name: fgc-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - fgc_network
    depends_on:
      - prometheus

networks:
  fgc_network:
    driver: bridge

volumes:
  localstack-data: