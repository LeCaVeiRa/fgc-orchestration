services:
  rabbitmq:
    image: rabbitmq:3.13.7-management
    container_name: fgc-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?defina RABBITMQ_USER no .env (copie de .env.example)}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD no .env (copie de .env.example)}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fgc_network

  fgc-users-api:
    build:
      context: ../fgc-users-api
      dockerfile: Dockerfile
    container_name: fgc-users-api
    ports:
      - "5038:8080"
    environment:
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=${RABBITMQ_USER:?defina RABBITMQ_USER no .env (copie de .env.example)}
      - RabbitMq__Password=${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD no .env (copie de .env.example)}
      - Jwt__Key=${JWT_KEY:?defina JWT_KEY no .env (copie de .env.example)}
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      # Atrás de proxy (Kong; ALB no EKS): honra X-Forwarded-For/Proto (middleware embutido do ASP.NET Core).
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - AWS__DynamoDB__ServiceUrl=http://dynamodb-local:8000
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - AWS_REGION=us-east-1
      # Timeouts curtos: Redis fora do ar degrada para o banco em ~1s em vez de ~5s por operação.
      # Na AWS (ElastiCache) a mesma string ganha ssl=true,password=... via Secret.
      - Redis__ConnectionString=redis:6379,connectTimeout=1000,syncTimeout=1000,asyncTimeout=1000,abortConnect=false
      - ConnectionStrings__UserDb=Host=postgres;Port=5432;Database=fgc_users;Username=fgc;Password=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (copie de .env.example)}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      dynamodb-local:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - fgc_network

  fgc-catalog-api:
    build:
      context: ../fgc-catalog-api
      dockerfile: Dockerfile
    container_name: fgc-catalog-api
    ports:
      - "5070:8080"
    environment:
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=${RABBITMQ_USER:?defina RABBITMQ_USER no .env (copie de .env.example)}
      - RabbitMq__Password=${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD no .env (copie de .env.example)}
      - Jwt__Key=${JWT_KEY:?defina JWT_KEY no .env (copie de .env.example)}
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      # Atrás de proxy (Kong; ALB no EKS): honra X-Forwarded-For/Proto (middleware embutido do ASP.NET Core).
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - AWS__DynamoDB__ServiceUrl=http://dynamodb-local:8000
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - AWS_REGION=us-east-1
      # Timeouts curtos: Redis fora do ar degrada para o banco em ~1s em vez de ~5s por operação.
      # Na AWS (ElastiCache) a mesma string ganha ssl=true,password=... via Secret.
      - Redis__ConnectionString=redis:6379,connectTimeout=1000,syncTimeout=1000,asyncTimeout=1000,abortConnect=false
      - OpenSearch__Url=http://opensearch:9200
      - ConnectionStrings__CatalogDb=Host=postgres;Port=5432;Database=fgc_catalog;Username=fgc;Password=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (copie de .env.example)}
    depends_on:
      opensearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      dynamodb-local:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - fgc_network

  dynamodb-local:
    image: amazon/dynamodb-local:3.3.1
    container_name: fgc-dynamodb-local
    ports:
      - "8500:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    networks:
      - fgc_network

  redis:
    image: redis:7.4.11-alpine
    container_name: fgc-redis
    ports:
      - "6379:6379"
    networks:
      - fgc_network

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: fgc-opensearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      # Dev: sem TLS/autenticação. Na AWS o domínio usa fine-grained access control (OpenSearch__Username/Password).
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - fgc_network

  postgres:
    image: postgres:16.15-alpine
    container_name: fgc-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=fgc
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (copie de .env.example)}
      - POSTGRES_DB=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fgc -d fgc_catalog"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fgc_network

  fgc-payments-api:
    build:
      context: ../fgc-payments-api
      dockerfile: Dockerfile
    container_name: fgc-payments-api
    ports:
      - "5050:8080"
    environment:
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=${RABBITMQ_USER:?defina RABBITMQ_USER no .env (copie de .env.example)}
      - RabbitMq__Password=${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD no .env (copie de .env.example)}
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      # Atrás de proxy (Kong; ALB no EKS): honra X-Forwarded-For/Proto (middleware embutido do ASP.NET Core).
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - fgc_network

  kong:
    build:
      context: ./kong
      dockerfile: Dockerfile
    container_name: fgc-kong
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/tmp/kong.yml
      - KONG_ADMIN_LISTEN=0.0.0.0:8001
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - JWT_SECRET=${JWT_KEY:?defina JWT_KEY no .env (copie de .env.example)}
      # Opcional: URL do HttpApi da Lambda (output HistoryApiUrl). Vazia = rota /notifications desligada.
      - NOTIFICATIONS_HISTORY_URL=${NOTIFICATIONS_HISTORY_URL:-}
    volumes:
      - ./kong/kong.yml.template:/kong-src/kong.yml.template:ro
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
    depends_on:
      - fgc-users-api
      - fgc-catalog-api
    networks:
      - fgc_network

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: fgc-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - fgc_network
    depends_on:
      - fgc-users-api
      - fgc-catalog-api

  grafana:
    image: grafana/grafana:13.2.0
    container_name: fgc-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?defina GRAFANA_ADMIN_USER no .env (copie de .env.example)}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD no .env (copie de .env.example)}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - fgc_network
    depends_on:
      - prometheus

networks:
  fgc_network:
    driver: bridge

volumes:
  postgres-data: